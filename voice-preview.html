<style>
/* =============== BASE (shared by every style) =============== */
:root{
  --bg1:#ff9a9e;--bg2:#fad0c4;--primary:#e5476b;--primaryText:#fff;--accent:#ffd166;
  --text:#3a1d2b;--card:#fff8f5;--cardText:#3a1d2b;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden}
body{
  --display:'Poppins','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Poppins','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --letter:'Dancing Script','Kalam','Segoe Script','Bradley Hand','Snell Roundhand','Noto Sans Devanagari',cursive;
  --radius:20px;--btn-radius:999px;--shadow:0 8px 22px rgba(0,0,0,.14);--border:0 solid transparent;
  --enter:sceneIn;--enter-dur:.7s;--enter-ease:ease;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);font-family:var(--body);-webkit-tap-highlight-color:transparent;
}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
#particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.particle{position:absolute;bottom:-60px;font-size:24px;opacity:.38;animation:floatUp linear infinite}
.particle svg{width:100%;height:100%;display:block}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(25deg)}}

#progress{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:5;padding:0 14px}
#progress span{width:7px;height:7px;border-radius:50%;background:var(--text);opacity:.2;transition:all .3s;position:relative;overflow:hidden}
#progress span.on{opacity:.8;width:20px;border-radius:4px}

.scene{
  position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;
  overflow-y:auto;text-align:center;
  padding:calc(44px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));
}
.scene.active{display:flex;animation:var(--enter) var(--enter-dur) var(--enter-ease) both}
@keyframes sceneIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.wrap{margin:auto 0;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative}

h1,h2,.greeting,.tline{font-family:var(--display)}
h1,h2{margin:0;line-height:1.25}
h1{font-size:clamp(28px,8vw,40px);font-weight:700}
h2{font-size:clamp(22px,6vw,28px);font-weight:700}
p{margin:0;line-height:1.55;white-space:pre-line}
.muted{opacity:.75;font-size:15px}


.gift-emoji{font-size:96px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
@keyframes bob{50%{transform:translateY(-14px) rotate(-4deg)}}
.greeting{font-size:clamp(30px,9vw,44px);font-weight:700}

#intro-lines{min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.tline{font-size:clamp(21px,6vw,27px);font-weight:600}
.caret::after{content:"|";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}

.cards{display:grid;gap:14px;width:100%}
.rcard{perspective:1000px;min-height:120px;cursor:pointer;animation:sceneIn .5s var(--d,0s) both}
.rinner{position:relative;width:100%;min-height:120px;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.rcard.open .rinner{transform:rotateY(180deg)}
.rface{position:absolute;inset:0;border-radius:var(--radius);border:var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow)}
.rfront{background:var(--primary);color:var(--primaryText);font-family:var(--display);font-weight:700;font-size:20px;gap:6px}
.rfront small{font-family:var(--body);font-weight:400;font-size:13px;opacity:.85}
.rback{background:var(--card);color:var(--cardText);transform:rotateY(180deg);gap:10px}
.rcard.open .rback{position:relative}
.rcard.open .rfront{position:absolute}

.gifbox{max-width:260px;width:100%;margin:0 auto}
.gif{width:100%;border-radius:14px;display:block}
.gif-fallback{font-size:64px;line-height:1;animation:wiggle 1.6s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}

.envelope{position:relative;width:250px;height:165px;cursor:pointer;margin-top:30px}
.env-body{position:absolute;inset:0;background:var(--primary);border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.2)}
.env-flap{position:absolute;top:0;left:0;width:0;height:0;border-left:125px solid transparent;border-right:125px solid transparent;border-top:95px solid var(--accent);transform-origin:top;transition:transform .6s ease;z-index:3}
.env-heart{position:absolute;left:50%;top:70px;transform:translate(-50%,-50%);font-size:34px;z-index:4;transition:opacity .3s}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
.envelope.open .env-heart{opacity:0}
.paper{
  background:var(--card);color:var(--cardText);border-radius:16px;padding:28px 24px;width:100%;
  text-align:left;box-shadow:0 14px 34px rgba(0,0,0,.18);display:none;position:relative;
  background-image:repeating-linear-gradient(transparent,transparent 31px,rgba(0,0,0,.06) 32px);
}
.paper.show{display:block;animation:paperUp .8s cubic-bezier(.2,1.2,.4,1) both}
@keyframes paperUp{from{opacity:0;transform:translateY(80px) scale(.9)}to{opacity:1;transform:none}}
.paper.script{font-family:var(--letter);font-size:23px}
.paper.script .lp{line-height:1.45}
.paper .lp{opacity:0;transform:translateY(8px);transition:all .6s;margin-bottom:12px}
.paper .lp.in{opacity:1;transform:none}
.paper .sig{text-align:right;margin-top:16px}

#arena{position:relative;width:100%;height:330px;border-radius:var(--radius);background:rgba(255,255,255,.22);overflow:hidden;border:var(--border)}
.pop{position:absolute;font-size:46px;cursor:pointer;user-select:none;animation:drift 3s ease-in-out infinite;transition:transform .2s,opacity .2s;touch-action:manipulation}
.pop.gone{transform:scale(1.8);opacity:0;pointer-events:none}
@keyframes drift{50%{translate:0 -14px}}
#wordbar{min-height:34px;font-family:var(--display);font-size:22px;font-weight:700;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#wordbar span{animation:sceneIn .4s both}
.qcard{background:var(--card);color:var(--cardText);border-radius:var(--radius);border:var(--border);padding:22px;width:100%;box-shadow:var(--shadow);position:relative;overflow:hidden}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{appearance:none;border:2px solid var(--primary);background:transparent;color:var(--cardText);font:600 16px var(--body);padding:12px;border-radius:14px;cursor:pointer}
.opt.right{background:var(--primary);color:var(--primaryText)}
.opt.wrong{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qfeed{min-height:24px;margin-top:12px;font-weight:600}
.scratch{position:relative;width:100%;max-width:340px;height:220px;border-radius:var(--radius);border:var(--border);overflow:hidden;background:var(--card);color:var(--cardText);box-shadow:var(--shadow)}
.scratch .hidden-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;font-family:var(--display);font-size:22px;font-weight:700}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.win{display:none;flex-direction:column;align-items:center;gap:12px}
.win.show{display:flex;animation:sceneIn .6s both}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}

/* Style switcher (preview only) */
#switcher{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;display:none;justify-content:center;padding:0 10px}
#switcher.show{display:flex}
#switcher .bar{display:flex;gap:6px;overflow-x:auto;padding:6px;border-radius:999px;background:rgba(20,20,20,.82);backdrop-filter:blur(8px);max-width:100%;scrollbar-width:none}
#switcher button{flex:none;appearance:none;border:0;border-radius:999px;padding:8px 12px;font:600 12px system-ui,sans-serif;color:#fff;background:transparent;cursor:pointer;white-space:nowrap}
#switcher button.on{background:#fff;color:#111}
body.has-switcher .scene{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}

/* =============== STYLE: GAME (immersive arcade / RPG) =============== */
[data-style="game"]{
  --display:'Press Start 2P','Noto Sans Devanagari',monospace;
  --body:'VT323','Noto Sans Devanagari',monospace;
  --letter:'VT323','Noto Sans Devanagari',monospace;
  --text:#f4f1ff;--card:#1b1440;--cardText:#f4f1ff;
  --radius:0;--btn-radius:0;--border:4px solid #f4f1ff;--shadow:6px 6px 0 rgba(0,0,0,.55);
  --enter:pixelIn;--enter-dur:.5s;--enter-ease:steps(5);
  background:radial-gradient(ellipse at 50% 30%,#2a1b6b,#0b0620 70%);font-size:21px;
}
[data-style="game"]::before{background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
[data-style="game"]::after{background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px}
@keyframes pixelIn{0%{opacity:0;clip-path:inset(50% 0 50% 0)}60%{opacity:1}100%{opacity:1;clip-path:inset(0)}}
[data-style="game"] h1{font-size:clamp(18px,5.6vw,24px);line-height:1.6;color:var(--accent);text-shadow:3px 3px 0 #000}
[data-style="game"] h2{font-size:clamp(14px,4.4vw,18px);line-height:1.6;text-shadow:3px 3px 0 #000}
[data-style="game"] .greeting{font-size:clamp(20px,6.4vw,28px);line-height:1.5;color:var(--accent);text-shadow:4px 4px 0 #000}
[data-style="game"] .tline{font-size:clamp(14px,4.4vw,18px);line-height:1.7;font-weight:400}
[data-style="game"] p,[data-style="game"] .muted{font-size:23px;line-height:1.3}
[data-style="game"] #s-landing .wrap::before{content:"★ NEW QUEST UNLOCKED ★";font:10px var(--display);letter-spacing:1px;color:var(--accent);animation:blink 1s steps(1) infinite}
[data-style="game"] .gift-emoji{animation:bob 1.2s steps(2) infinite;filter:drop-shadow(6px 6px 0 #000)}
[data-style="game"] #progress span{display:none}
[data-style="game"] #progress::before{content:attr(data-label);font:10px 'Press Start 2P',monospace;color:#fff;background:rgba(0,0,0,.6);border:3px solid #fff;padding:7px 10px;letter-spacing:1px}
[data-style="game"] .rinner{transition:transform .5s steps(6)}
[data-style="game"] .rfront{font-size:13px;line-height:1.6;background:var(--accent);color:#111;box-shadow:inset -6px -6px 0 rgba(0,0,0,.25),6px 6px 0 #000}
[data-style="game"] .rfront::before{content:"?";font:28px 'Press Start 2P',monospace;color:#fff;text-shadow:3px 3px 0 #000}
[data-style="game"] .rfront small{font:18px var(--body)}
[data-style="game"] .rback::before{content:"ITEM UNLOCKED";font:9px 'Press Start 2P',monospace;color:var(--accent)}
[data-style="game"] .gif{border-radius:0;image-rendering:pixelated;box-shadow:4px 4px 0 #000}
[data-style="game"] .gif-fallback{animation:bob 1s steps(2) infinite}
[data-style="game"] .env-body{border-radius:0;border:4px solid #fff;box-shadow:6px 6px 0 #000}
[data-style="game"] .env-flap{transition:transform .5s steps(4)}
[data-style="game"] .paper{background:#120c33;border:4px solid #fff;outline:4px solid #120c33;border-radius:0;box-shadow:8px 8px 0 #000;background-image:none;font-size:24px;line-height:1.3}
[data-style="game"] .paper::after{content:"▼";position:absolute;right:14px;bottom:8px;color:var(--accent);animation:blink .8s steps(1) infinite}
[data-style="game"] .paper .lp{transition:opacity .3s steps(3)}
[data-style="game"] #arena{background:rgba(0,0,0,.35)}
[data-style="game"] .pop{animation:bob 1s steps(2) infinite;filter:drop-shadow(4px 4px 0 #000)}
[data-style="game"] #wordbar{font-size:13px;line-height:1.8;color:var(--accent)}
[data-style="game"] .opt{border-radius:0;border:3px solid #fff;color:#fff;font:22px var(--body);text-align:left;padding:10px 14px}
[data-style="game"] .opt::before{content:"▶ ";color:var(--accent)}
[data-style="game"] .opt.right{background:var(--accent);color:#111}
[data-style="game"] .qcard h2{font-size:13px;line-height:1.8}
[data-style="game"] .scratch .hidden-msg{font-size:14px;line-height:1.8}

/* =============== STYLE: STOP-MOTION (paper cut-out, jittery frames) =============== */
[data-style="stopmotion"]{
  --display:'Chewy','Noto Sans Devanagari',cursive;
  --body:'Patrick Hand','Noto Sans Devanagari',system-ui,sans-serif;
  --letter:'Patrick Hand','Kalam','Noto Sans Devanagari',cursive;
  --radius:6px;--btn-radius:10px;--shadow:5px 7px 0 rgba(0,0,0,.22);
  --enter:stepIn;--enter-dur:.45s;--enter-ease:steps(4);
  background:var(--bg2);font-size:19px;
}
[data-style="stopmotion"]::before{opacity:.5;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
[data-style="stopmotion"]::after{background:none}
@keyframes stepIn{0%{opacity:0;transform:translateY(40px) rotate(-4deg)}50%{opacity:1;transform:translateY(-8px) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes boil{0%{rotate:-.8deg;translate:0 0}33%{rotate:.7deg;translate:1px -1px}66%{rotate:-.2deg;translate:-1px 1px}}
[data-style="stopmotion"] h1,[data-style="stopmotion"] h2,[data-style="stopmotion"] .greeting,[data-style="stopmotion"] .tline{font-weight:400;letter-spacing:.5px;text-shadow:3px 3px 0 rgba(0,0,0,.15)}
[data-style="stopmotion"] .greeting,[data-style="stopmotion"] h1,[data-style="stopmotion"] h2,[data-style="stopmotion"] .btn,[data-style="stopmotion"] .gift-emoji,[data-style="stopmotion"] .rcard,[data-style="stopmotion"] .envelope,[data-style="stopmotion"] .qcard,[data-style="stopmotion"] .scratch,[data-style="stopmotion"] .tline{animation-name:boil;animation-duration:.6s;animation-timing-function:steps(1);animation-iteration-count:infinite}

[data-style="doodle"] .greeting::after{content:"";display:block;height:14px;margin-top:4px;background:var(--accent);-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 14'><path d='M3 8 Q 20 1 37 8 T 71 8 T 105 8 T 139 8 T 173 8 T 197 8' fill='none' stroke='black' stroke-width='4' stroke-linecap='round'/></svg>") center/100% 100% no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 14'><path d='M3 8 Q 20 1 37 8 T 71 8 T 105 8 T 139 8 T 173 8 T 197 8' fill='none' stroke='black' stroke-width='4' stroke-linecap='round'/></svg>") center/100% 100% no-repeat}
[data-style="doodle"] h1,[data-style="doodle"] h2,[data-style="doodle"] .tline{font-weight:600}
[data-style="doodle"] .tline:last-child::before{content:"✶ ";color:var(--accent)}
@keyframes wobble{25%{rotate:-2deg}75%{rotate:2deg}}
[data-style="doodle"] .rface{box-shadow:var(--shadow)}
[data-style="doodle"] .rcard:nth-child(3n+2) .rfront{background:var(--accent);color:var(--cardText)}

[data-style="doodle"] .rfront::after{content:"";position:absolute;right:16px;top:12px;width:26px;height:26px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2l2.6 6.9L22 9.3l-5.7 4.6L18.2 21 12 17l-6.2 4 1.9-7.1L2 9.3l7.4-.4z' fill='none' stroke='%23000' stroke-width='1.8' stroke-linejoin='round'/></svg>") center/contain no-repeat;opacity:.6}
[data-style="doodle"] .gif{border:2.5px solid var(--text);border-radius:var(--radius)}
[data-style="doodle"] .env-body{border:2.5px solid var(--text);border-radius:14px;box-shadow:var(--shadow)}
[data-style="doodle"] .paper{border:2.5px solid var(--cardText);border-radius:20px 8px 24px 10px/10px 24px 8px 20px;box-shadow:6px 7px 0 color-mix(in srgb,var(--cardText) 75%,transparent);background-image:radial-gradient(color-mix(in srgb,var(--cardText) 14%,transparent) 1.4px,transparent 1.6px);background-size:20px 20px}
[data-style="doodle"] .paper.script{font-size:24px}
[data-style="doodle"] .opt{border:2.5px solid var(--cardText);border-radius:var(--btn-radius);font-weight:600}
[data-style="doodle"] .particle{opacity:.75;bottom:-80px;width:42px;height:42px}

/* =============== OPTIONAL STEPS (shared; styles skin .panel) =============== */
.stage{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.panel{background:var(--card);color:var(--cardText);border-radius:var(--radius);border:var(--border);box-shadow:var(--shadow);padding:16px 18px;width:100%;text-align:left;position:relative}
.panel p{line-height:1.5}
.tl{position:relative;gap:18px}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:60px;width:3px;translate:-50% 0;background:repeating-linear-gradient(var(--text) 0 8px,transparent 8px 14px);opacity:.35;z-index:-1}
.tl-item{width:100%;animation:sceneIn .5s both}
.tl-item:nth-child(odd) .panel{rotate:-.8deg}.tl-item:nth-child(even) .panel{rotate:.8deg}
.tl-when{display:inline-block;font-family:var(--display);font-weight:700;font-size:14px;background:var(--primary);color:var(--primaryText);padding:3px 12px;border-radius:999px;margin-bottom:8px}
.panel .gifbox{margin:6px auto 10px}
.cake{position:relative;width:240px;margin:20px auto 6px;display:flex;flex-direction:column;align-items:center}
.candles{display:flex;gap:6px;justify-content:center;height:78px;align-items:flex-end;margin-bottom:-2px;z-index:2}
.candle{appearance:none;border:0;background:none;padding:0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;touch-action:manipulation}
.stick{width:10px;height:38px;border-radius:3px;background:repeating-linear-gradient(-45deg,var(--accent) 0 5px,#fff 5px 10px);box-shadow:inset -2px 0 0 rgba(0,0,0,.12)}
.flame{width:16px;height:26px;margin-bottom:3px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 75%,#fff 0 18%,#ffd54a 30%,#ff8a00 70%,transparent 72%);filter:drop-shadow(0 0 10px rgba(255,170,40,.9));animation:flicker .18s ease-in-out infinite alternate;transform-origin:50% 100%;position:relative}
@keyframes flicker{to{transform:scale(.92,1.06) rotate(2deg)}}
.candle.out .flame::after{content:"";position:absolute;left:50%;bottom:0;width:10px;height:10px;border-radius:50%;background:rgba(160,160,160,.7);animation:smoke 1s ease-out forwards}
.candle.out{pointer-events:none}
.candle .flame::after{content:none}
.candle.out .flame{transform:none;opacity:1;background:none;filter:none}
@keyframes smoke{to{transform:translate(-50%,-50px) scale(2.4);opacity:0}}
.tier{border-radius:14px 14px 8px 8px;border:var(--border);box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.tier.t1{width:170px;height:56px;background:var(--card);position:relative}
.tier.t1::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:20px;border-radius:14px 14px 0 0;background:radial-gradient(circle at 10px 18px,var(--primary) 9px,transparent 10px) 0 0/20px 26px repeat-x,var(--primary);clip-path:inset(0 0 -10px 0);opacity:.9}
.tier.t2{width:220px;height:64px;background:var(--primary);margin-top:-2px;background-image:radial-gradient(var(--accent) 3px,transparent 3.5px);background-size:18px 18px}
.plate{width:250px;height:12px;border-radius:50%;background:color-mix(in srgb,var(--text) 25%,transparent);margin-top:2px}
.coupons{gap:14px}
.coupon{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 18px;animation:sceneIn .5s var(--d,0s) both;
  -webkit-mask:radial-gradient(circle 11px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.cp-body{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
.cp-stub{flex:none;width:92px;align-self:stretch;display:flex;align-items:center;justify-content:center;border-left:2px dashed color-mix(in srgb,var(--cardText) 30%,transparent);padding-left:10px;position:relative}
.cp-icon{font-size:30px;flex:none}
.cp-title{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2}
.cp-note{font-size:14px;opacity:.75;margin-top:2px}
.coupon .btn.small{min-width:0;width:100%;padding:8px 6px;font-size:14px;min-height:44px;letter-spacing:0}
[data-style="game"] .coupon .btn.small{font-size:9px}
[data-style="scrapbook"] .coupon .btn.small{font-size:20px}
.coupon.claimed .btn{visibility:hidden}
.cp-title{word-break:normal;overflow-wrap:anywhere}
.stamp{position:absolute;left:50%;top:50%;translate:-45% -50%;font:800 14px var(--display);white-space:nowrap;color:var(--primary);border:3px solid var(--primary);border-radius:10px;padding:2px 10px;opacity:0;transform:scale(2.2) rotate(-14deg);transition:all .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.coupon.claimed .stamp{opacity:.9;transform:scale(1) rotate(-14deg)}
.wheel{position:relative;width:min(300px,80vw);aspect-ratio:1}
.wheel-svg{width:100%;height:100%;transition:transform 4s cubic-bezier(.17,.67,.12,1);filter:drop-shadow(0 8px 16px rgba(0,0,0,.2))}
.wheel-svg text{font:700 15px var(--display)}
.wheel-svg .seg{stroke:var(--cardText);stroke-width:2}
.wheel-svg .hub{fill:var(--card);stroke:var(--cardText);stroke-width:3}
.pointer{position:absolute;left:50%;top:-6px;translate:-50% 0;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--text);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.wheel-result{text-align:center;animation:sceneIn .5s both}
.ow-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini-env{appearance:none;border:0;cursor:pointer;position:relative;aspect-ratio:4/3;border-radius:10px;background:var(--primary);color:var(--primaryText);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;box-shadow:var(--shadow);overflow:hidden;font:600 14px var(--body);animation:sceneIn .5s var(--d,0s) both;transition:transform .15s}
.mini-env::before{content:"";position:absolute;left:0;right:0;top:0;height:60%;background:var(--accent);clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .4s;transform-origin:top}
.mini-env:active{transform:scale(.96)}
.mini-env.opened::before{transform:scaleY(-.4)}
.mini-env.opened{opacity:.75}
.me-icon{position:absolute;top:28%;font-size:26px;z-index:1}
.me-label{position:relative;z-index:1;line-height:1.2}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px}
.sheet.show{display:flex;animation:sceneIn .35s both}
.sheet-card{max-width:400px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.details-card{display:flex;flex-direction:column;gap:14px}
.d-row{display:flex;gap:14px;align-items:flex-start}
.d-icon{font-size:24px;width:34px;text-align:center}
.d-label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.65}
.d-value{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.3}
.promise-list{display:flex;flex-direction:column;gap:6px;padding:10px}
.promise{appearance:none;border:0;background:transparent;color:inherit;font:500 17px/1.4 var(--body);display:flex;gap:12px;align-items:center;text-align:left;padding:12px 8px;border-radius:12px;cursor:pointer;min-height:52px}
.promise:active{background:color-mix(in srgb,var(--primary) 12%,transparent)}
.tick{flex:none;width:28px;height:28px;border-radius:8px;border:2.5px solid var(--primary);display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.promise.done .tick{background:var(--primary);transform:rotate(-8deg) scale(1.1)}
.promise.done .tick::after{content:"✓";color:var(--primaryText);font-weight:800}
.seal{font:800 20px var(--display);padding:8px 18px;border:3px solid var(--primary);color:var(--text);border-radius:999px;rotate:-6deg;animation:sceneIn .5s both}

/* =============== ANIMATED BIRTHDAY STEPS: bouquet, cake, balloons, gallery =============== */
/* The artwork (assets/art/*.svg) is put in #gift-art by build_gift.py, only for the steps in the
   flow. Without it each step falls back to a big emoji, so a hand-copied template still works.
   Centring uses the `translate` property so the entrance animations can own `transform`. */
.art-fallback{font-size:110px;line-height:1;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18))}
.art-svg svg{width:100%;height:auto;display:block;overflow:visible}

/* bouquet: stems grow, leaves pop, flowers bloom in clusters, then the paper wrap and bow arrive */
.bq-scene{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.bq-head{align-self:flex-start;max-width:78%;text-align:left;padding:14px 18px;border-radius:24px;background:color-mix(in srgb,#fff 25%,transparent);backdrop-filter:blur(2px);position:relative;z-index:10}
.bq-kicker{font-family:var(--letter);font-size:24px;color:var(--primary);margin:0;animation:fadeUp .8s both}
.bq-title{font-family:var(--display);font-size:min(9vw,46px);line-height:1.02;color:var(--primary);margin:4px 0 0;animation:fadeUp .8s .1s both}
.bq-name{display:inline-block;font-size:min(13vw,68px);animation:scaleIn .7s .35s cubic-bezier(.16,.9,.3,1.25) both}
.bq-note{margin:8px 0 0;font-size:15px;font-style:italic;font-weight:500;opacity:.8;animation:fadeUp .8s .5s both}
.bq{position:relative;height:min(50vh,430px);aspect-ratio:157/273;margin-top:-18px;align-self:flex-end;margin-right:4%}
.bq-art{position:relative;height:100%;z-index:3}
.bq-art svg{width:100%;height:100%;display:block;overflow:visible}
.bq-halo{position:absolute;left:10%;right:10%;top:4%;height:69%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--primary) 18%,transparent),transparent 70%);filter:blur(12px);z-index:-1;opacity:0;animation:fadeIn 1.1s .65s forwards}
.bq-back{position:absolute;left:50%;translate:-50% 0;bottom:4.5%;width:74%;height:42%;z-index:1;opacity:0;transform:translateY(70px) scale(.94);animation:bqRise .82s cubic-bezier(.2,.85,.25,1) 2.62s forwards}
.bq-front{position:absolute;left:50%;translate:-50% 0;bottom:3.3%;width:60%;height:30%;z-index:5;pointer-events:none;opacity:0;transform:translateY(60px);animation:bqRise .72s cubic-bezier(.2,.85,.25,1) 2.82s forwards}
.bq-paper-l,.bq-paper-r{position:absolute;bottom:0;width:72%;height:100%;box-shadow:0 16px 30px #72474a1a}
.bq-paper-l{left:0;rotate:3deg;clip-path:polygon(4% 3%,100% 25%,73% 100%,31% 84%);background:linear-gradient(#f9e4dc,#f3d6c9)}
.bq-paper-r{right:0;rotate:-3deg;clip-path:polygon(0 25%,96% 3%,69% 84%,27% 100%);background:linear-gradient(#f8dfd5,#e6bfb1)}
.bq-paper-in{position:absolute;bottom:8%;left:50%;translate:-50% 0;width:60%;height:72%;opacity:.68;clip-path:polygon(50% 0,95% 22%,66% 100%,34% 100%,5% 22%);background:linear-gradient(#fff1ea,#e8bfb3)}
.bq-paper-f{position:absolute;inset:0;clip-path:polygon(12% 4%,88% 4%,74% 100%,27% 100%);filter:drop-shadow(0 11px 14px #5e3a3e1a);background:linear-gradient(165deg,#f8ddd3,#e5bbae)}
.bq-bow{position:absolute;left:50%;translate:-50% 0;top:28%;width:min(148px,78%);opacity:0;transform-origin:50% 30%;filter:drop-shadow(0 6px 8px #602f3e29);transform:scale(.72) rotate(-2deg);animation:bqBow .64s cubic-bezier(.16,.9,.3,1.2) 3.02s forwards}
.bq-sparks{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:visible}
.anim-stem{transform-box:fill-box;transform-origin:bottom;opacity:0;transform:translateY(25px) scaleY(.84);animation:bqStem .68s var(--delay,0s) cubic-bezier(.2,.8,.25,1) forwards}
.anim-leaf{transform-box:fill-box;transform-origin:50%;opacity:0;transform:scale(.2) rotate(-10deg);animation:bqLeaf .55s var(--delay,0s) cubic-bezier(.16,.9,.3,1.15) forwards}
.anim-flower{transform-box:fill-box;transform-origin:50% 78%;opacity:0;transform:translateY(18px) scale(.35) rotate(-5deg);animation:bqFlower .72s var(--delay,0s) cubic-bezier(.16,.9,.3,1.22) forwards,bqSway 5.2s calc(var(--delay,0s) + .86s) ease-in-out infinite alternate}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0;background:#fffffff5;box-shadow:0 0 9px #fffffff2,0 0 16px color-mix(in srgb,var(--primary) 55%,transparent);animation:sparkLoop var(--dur) var(--delay) ease-in-out infinite}
.star{position:absolute;width:14px;height:14px;opacity:0;animation:starLoop var(--dur) var(--delay) ease-in-out infinite}
.star::before,.star::after{content:"";position:absolute;top:0;left:6px;width:2px;height:14px;border-radius:99px;background:#fffffff5;box-shadow:0 0 10px color-mix(in srgb,var(--primary) 70%,transparent)}
.star::after{rotate:90deg}
@keyframes fadeIn{to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes bqRise{to{opacity:1;transform:none}}
@keyframes bqBow{0%{opacity:0;transform:translateY(10px) scale(.58) rotate(-5deg)}65%{opacity:1;transform:translateY(-2px) scale(1.07) rotate(1deg)}to{opacity:1;transform:none}}
@keyframes bqStem{to{opacity:1;transform:none}}
@keyframes bqLeaf{60%{opacity:1;transform:scale(1.08) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes bqFlower{0%{opacity:0;transform:translateY(18px) scale(.35) rotate(-5deg)}60%{opacity:1;transform:translateY(-4px) scale(1.07) rotate(1deg)}to{opacity:1;transform:none}}
@keyframes bqSway{from{transform:rotate(-1.4deg)}to{transform:translateY(-2px) rotate(1.6deg)}}
@keyframes sparkLoop{0%,to{opacity:0;transform:translateY(10px) scale(.4)}23%{opacity:.95}58%{opacity:.72;transform:translate(var(--dx),-18px) scale(1)}82%{opacity:.1;transform:translate(calc(var(--dx) * 1.25),-36px) scale(.68)}}
@keyframes starLoop{0%,to{opacity:0;transform:scale(.45) rotate(0)}35%{opacity:.95;transform:scale(1) rotate(45deg)}70%{opacity:.28;transform:scale(.72) rotate(90deg)}}

/* cake: tiers drop in one by one, toppings land, the candle drops and lights; a tap blows it out */
.ck{position:relative;width:min(300px,62vw);margin:44px auto 14px;cursor:pointer}
.ck-shadow{position:absolute;left:50%;translate:-50% 0;bottom:-6px;width:70%;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.35),transparent 70%);opacity:0;animation:fadeIn .55s .15s forwards}
.ck-art{position:relative;filter:drop-shadow(0 15px 14px rgba(0,0,0,.3))}
.ck-art .tier-bottom,.ck-art .tier-middle,.ck-art .tier-top,.ck-art .top-bottom,.ck-art .top-middle,.ck-art .top-top{transform-box:fill-box;transform-origin:bottom;opacity:0}
.ck-art .tier-bottom{animation:tierDrop .78s cubic-bezier(.16,.78,.25,1.14) .4s forwards}
.ck-art .tier-middle{animation:tierDrop .78s cubic-bezier(.16,.78,.25,1.14) 1.2s forwards}
.ck-art .tier-top{animation:tierDrop .78s cubic-bezier(.16,.78,.25,1.14) 2s forwards}
.ck-art .top-bottom{animation:toppingDrop .56s cubic-bezier(.16,.8,.25,1.18) 2.88s forwards}
.ck-art .top-middle{animation:toppingDrop .56s cubic-bezier(.16,.8,.25,1.18) 3.42s forwards}
.ck-art .top-top{animation:toppingDrop .56s cubic-bezier(.16,.8,.25,1.18) 3.96s forwards}
.ck .art-fallback{display:block;text-align:center;font-size:150px}
.ck-candle{position:absolute;left:50%;translate:-50% 0;top:-17%;width:18px;height:56px;z-index:12;opacity:0;transform:translateY(-140px) rotate(-8deg);animation:candleDrop .82s cubic-bezier(.16,.79,.25,1.15) 4.6s forwards}
.ck-stick{position:absolute;left:50%;translate:-50% 0;bottom:0;width:11px;height:35px;border-radius:5px 5px 2px 2px;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 45%,#fff) 48%,color-mix(in srgb,var(--primary) 75%,#000))}
.ck-wick{position:absolute;left:50%;translate:-50% 0;bottom:33px;width:2px;height:7px;border-radius:2px;background:#6b5148}
.ck-flamewrap{position:absolute;left:50%;translate:-50% 0;bottom:38px;width:24px;height:29px;transform-origin:50% 90%;opacity:0;animation:lightCandle .4s cubic-bezier(.16,.9,.3,1.3) 5.5s forwards}
.ck-glow{position:absolute;left:50%;top:50%;translate:-50% -50%;width:35px;height:35px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,99,.4),rgba(255,210,99,0) 68%);animation:glowPulse 1.9s ease-in-out 5.8s infinite alternate}
.ck-flame{position:absolute;left:50%;translate:-50% 0;bottom:3px;width:11px;height:17px;border-radius:60% 40% 55% 45%/72% 65% 35% 28%;background:linear-gradient(180deg,#fff8b8,#ffd95d 38%,#ff9b37);box-shadow:0 0 8px rgba(255,175,49,.76);transform-origin:50% 90%;animation:flameFlicker .72s ease-in-out 5.78s infinite alternate}
.ck.out .ck-flamewrap{animation:none;opacity:0;transition:opacity .25s}
.ck-spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px #ffbc6fd9;opacity:0;animation:lightSpark 2.4s ease-in-out 6s infinite}
.ck.out .ck-spark{display:none}
.ck-burst{position:absolute;left:50%;top:-14%;width:1px;height:1px;pointer-events:none}
.ck-burst i{position:absolute;left:0;top:0;animation:burstOut .9s cubic-bezier(.12,.76,.24,1) var(--delay) forwards}
.ck-msg{font-family:var(--letter);font-size:28px;color:var(--accent);min-height:38px;margin:2px 0 0}
.ck-msg .caret-bar{animation:caretBlink 1s steps(1) infinite}
.ck-hint{margin:4px 0 0;font-size:14px;font-weight:600;opacity:.75}
.ck.out ~ .ck-hint{opacity:1;color:var(--primary)}
@keyframes tierDrop{0%{opacity:0;transform:translateY(-160px) rotate(-2deg)}68%{opacity:1;transform:translateY(5px) scaleY(.91) scaleX(1.015)}84%{opacity:1;transform:translateY(-4px) scaleY(1.035) scaleX(.995)}to{opacity:1;transform:none}}
@keyframes toppingDrop{0%{opacity:0;transform:translateY(-120px) scale(.92)}70%{opacity:1;transform:translateY(3px) scaleY(.88) scaleX(1.05)}86%{opacity:1;transform:translateY(-2px) scale(1.05)}to{opacity:1;transform:none}}
@keyframes candleDrop{0%{opacity:0;transform:translateY(-140px) rotate(-8deg)}72%{opacity:1;transform:translateY(4px) rotate(2deg)}88%{opacity:1;transform:translateY(-3px) rotate(-1deg)}to{opacity:1;transform:none}}
@keyframes lightCandle{0%{opacity:0;transform:scale(.1)}65%{opacity:1;transform:scale(1.22)}to{opacity:1;transform:none}}
@keyframes flameFlicker{from{transform:rotate(-4deg) scaleX(.92) scaleY(1.04)}to{transform:rotate(4deg) scaleX(1.04) scaleY(.93)}}
@keyframes glowPulse{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1.12)}}
@keyframes lightSpark{0%,to{opacity:0;transform:scale(.4)}40%{opacity:1;transform:translateY(-8px) scale(1)}}
@keyframes burstOut{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--bx),var(--by)) scale(.6) rotate(180deg)}}
@keyframes caretBlink{50%{opacity:0}}

/* balloons: each pop bursts into fragments and sparks, and a reason card slides in below */
.bl-field{position:relative;width:100%;max-width:460px;height:210px;margin:24px auto 0;overflow:hidden;transition:max-height .7s cubic-bezier(.22,1,.36,1),opacity .5s ease,margin .7s cubic-bezier(.22,1,.36,1);max-height:210px}
.bl-field.done{max-height:0;opacity:0;margin:0 auto}
.bl{position:absolute;width:64px;height:156px;translate:-50% -50%;scale:var(--scale);animation:balloonFloat var(--dur) ease-in-out var(--delay) infinite alternate}
.bl.popped{animation-play-state:paused}
.bl-btn{appearance:none;border:0;background:none;padding:0;position:absolute;inset:0;cursor:pointer;filter:drop-shadow(0 13px 13px rgba(78,43,54,.15));touch-action:manipulation}
.bl-btn img,.bl-btn svg{width:100%;height:100%;display:block}
.bl.popped .bl-btn{pointer-events:none;animation:balloonPop .34s cubic-bezier(.12,.76,.24,1) forwards}
.bl-frag,.bl-sparkle{position:absolute;left:50%;top:29%;pointer-events:none}
.bl-frag{width:12px;height:7px;border-radius:70% 30% 65% 35%;animation:fragBurst .58s cubic-bezier(.12,.76,.2,1) forwards}
.bl-sparkle{width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 9px rgba(255,255,255,.95);animation:sparkBurst .5s ease-out forwards}
.bl-reasons{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;margin:14px auto 0;text-align:left}
.bl-reason{border-left:5px solid var(--bc);box-shadow:var(--shadow),0 0 26px -10px var(--bc);animation:fadeUp 1.2s cubic-bezier(.22,1,.36,1) both}
.bl-chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:color-mix(in srgb,var(--bc) 22%,transparent)}
.bl-reason p{margin:6px 0 0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.bl-outro{font-family:var(--letter);font-size:26px;color:var(--accent);margin:10px 0 0;animation:fadeUp .8s both}
@keyframes balloonFloat{from{transform:translate(-5px,8px) rotate(-2deg)}to{transform:translate(6px,-13px) rotate(2deg)}}
@keyframes balloonPop{0%{opacity:1;transform:scale(1)}32%{opacity:1;transform:scale(1.13,.91)}60%{opacity:1;transform:scale(.76,1.17)}to{opacity:0;transform:scale(.04)}}
@keyframes fragBurst{from{opacity:1;transform:translate(-50%,-50%) scale(.8)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(.3)}}
@keyframes sparkBurst{from{opacity:1;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4)}}

/* gallery: twinkling fairy lights over a swipeable row of polaroids */
.gl-lights{width:100%;max-width:560px;height:32px;margin:4px auto 0;display:block}
.gl-bulb{animation:twinkle 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.gl-row{display:flex;gap:16px;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;justify-content:safe center;padding:8px 16px 16px;scrollbar-width:none}
.gl-row::-webkit-scrollbar{display:none}
.gl-item{flex:none;width:min(62%,260px);scroll-snap-align:center}
.pol{margin:0;border-radius:10px;background:#fdf6e7;padding:10px 10px 32px;box-shadow:0 18px 40px -14px rgba(0,0,0,.55);animation:fadeUp .7s var(--d,0s) both}
.pol-img{position:relative;width:100%;min-height:160px;max-height:320px;overflow:hidden;border-radius:4px;background:color-mix(in srgb,var(--text) 80%,#000);display:grid;place-items:center;font-size:40px}
.pol-img img{width:100%;height:auto;max-height:320px;object-fit:contain;display:block}
.pol figcaption{font-family:var(--letter);font-size:20px;line-height:1.2;color:#6b4a2a;text-align:center;margin-top:8px;min-height:24px}
.gl-dots{display:flex;gap:6px;justify-content:center}
.gl-dots span{height:6px;width:6px;border-radius:999px;background:color-mix(in srgb,var(--text) 25%,transparent);transition:all .25s}
.gl-dots span.on{width:20px;background:var(--primary)}
@keyframes twinkle{0%,to{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* the new steps in each style */
[data-style="game"] .bq-title,[data-style="game"] .bq-name{font-size:clamp(18px,6vw,26px);line-height:1.5;text-shadow:3px 3px 0 #000}
[data-style="game"] .bq-kicker,[data-style="game"] .ck-msg,[data-style="game"] .bl-outro{font-family:var(--body)}
[data-style="game"] .bq-head{background:rgba(0,0,0,.45);border:3px solid #fff;border-radius:0}
[data-style="game"] .pol{border-radius:0;background:#fff;box-shadow:6px 6px 0 #000}
[data-style="game"] .pol-img{border-radius:0;image-rendering:pixelated}
[data-style="game"] .bl-chip{border-radius:0;font-size:9px}
[data-style="game"] .ck-flame,[data-style="game"] .anim-flower{animation-timing-function:steps(3)}
[data-style="stopmotion"] .bq-scene,[data-style="stopmotion"] .ck,[data-style="stopmotion"] .pol{animation-name:boil;animation-duration:.6s;animation-timing-function:steps(1);animation-iteration-count:infinite}
[data-style="stopmotion"] .pol{clip-path:polygon(0 1%,30% 0,60% 1%,100% 0,99% 40%,100% 100%,55% 99%,0 100%,1% 50%);box-shadow:none;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.2))}
[data-style="insta"] .bq-head{background:rgba(0,0,0,.35)}
[data-style="insta"] .bq-kicker,[data-style="insta"] .bq-title,[data-style="insta"] .ck-msg,[data-style="insta"] .bl-outro{color:#fff}
[data-style="insta"] .bq-title{text-transform:uppercase}
[data-style="insta"] .pol{border-radius:12px;background:#fff}
[data-style="canva"] .bq-head{background:transparent;backdrop-filter:none}
[data-style="canva"] .bq-title{font-style:italic;font-weight:400}
[data-style="canva"] .pol{border-radius:2px;box-shadow:0 20px 50px rgba(0,0,0,.08);outline:1px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:-5px}
[data-style="scrapbook"] .bq-head{background:#fffdf7;rotate:-2deg;box-shadow:var(--shadow)}
[data-style="scrapbook"] .bq-head::before{content:"";position:absolute;top:-10px;left:50%;width:64px;height:20px;translate:-50% 0;rotate:-4deg;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent) 80%,transparent) 0 5px,color-mix(in srgb,var(--accent) 55%,transparent) 5px 10px);opacity:.9}
[data-style="scrapbook"] .pol{border-radius:0;background:#fff;position:relative}
[data-style="scrapbook"] .pol::before{content:"";position:absolute;top:-10px;left:50%;width:72px;height:20px;translate:-50% 0;rotate:3deg;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--primary) 80%,transparent) 0 5px,color-mix(in srgb,var(--primary) 55%,transparent) 5px 10px);opacity:.9}
[data-style="scrapbook"] .gl-item:nth-child(odd) .pol{rotate:-2.2deg}
[data-style="scrapbook"] .gl-item:nth-child(odd) .pol::before{rotate:-5deg}
[data-style="scrapbook"] .gl-item:nth-child(even) .pol{rotate:1.8deg}
[data-style="scrapbook"] .gl-item:nth-child(even) .pol::before{rotate:5deg}
[data-style="brutal"] .bq-head{background:#fff;border:3px solid #111;box-shadow:6px 6px 0 #111;border-radius:12px;backdrop-filter:none}
[data-style="brutal"] .pol{border:3px solid #111;border-radius:12px;box-shadow:6px 6px 0 #111}
[data-style="brutal"] .bl-reason{border:3px solid #111;border-left-width:8px;border-left-color:var(--bc);box-shadow:5px 5px 0 #111}
[data-style="doodle"] .pol{border:2.5px solid var(--text);box-shadow:var(--shadow)}
[data-style="doodle"] .bq-head{border:2.5px dashed var(--text)}
.gl-item:nth-child(odd) .pol{rotate:-2.2deg}
.gl-item:nth-child(even) .pol{rotate:1.8deg}

/* =============== GIFT-BOX LANDING, SLOT MACHINE, YAY, SEALED LETTER, PARTY FINALE =============== */
/* landing.layout "giftbox": a card with a wobbling gift box sitting on its top edge */
.gb-card{position:relative;width:min(340px,100%);border-radius:20px;padding:86px 28px 36px;margin-top:100px;
  background:linear-gradient(165deg,color-mix(in srgb,var(--primary) 7%,#fff),color-mix(in srgb,var(--primary) 16%,#fff));
  border:1px solid color-mix(in srgb,var(--primary) 25%,#fff);box-shadow:0 24px 50px -20px color-mix(in srgb,var(--primary) 45%,transparent);color:var(--cardText);animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both}
.gb-box{position:absolute;left:50%;top:0;width:200px;height:200px;translate:-50% -50%;filter:drop-shadow(0 12px 20px color-mix(in srgb,var(--primary) 30%,transparent))}
.gb-box svg{width:100%;height:100%;overflow:visible}
.gb-lid{transform-box:fill-box;transform-origin:50% 100%;animation:gbLid 1.3s ease-in-out infinite}
.gb-spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.3s ease-in-out infinite}
.gb-kicker{margin:18px 0 0;font-size:13px;font-weight:700;letter-spacing:.12em;opacity:.7}
.gb-card .greeting{font-family:var(--letter);color:var(--primary);font-size:44px;line-height:1;margin-top:4px}
.gb-card .greeting.display{font-family:var(--display);font-weight:800;color:var(--cardText);font-size:clamp(24px,7vw,30px);line-height:1.2}
.gb-card #land-line{margin:14px 0 0;font-size:15px;opacity:.8}
.gb-note{margin:0;font-size:13px;opacity:.6}
@keyframes gbLid{0%,12%,100%{transform:none}28%{transform:translateY(-14%) rotate(-5deg)}44%{transform:translateY(-16%) rotate(5deg)}58%{transform:translateY(-12%) rotate(-3deg)}74%{transform:translateY(-4%) rotate(1deg)}}

/* slots: three reels that all land on the prize, then the prize grows into a gift that bursts open */
.sl-reels{--icon:clamp(56px,min(19vw,11vh),92px);display:flex;gap:clamp(8px,2.5vw,16px);padding:clamp(14px,4vw,26px);margin:calc(var(--icon) * .5) 0 8px;border-radius:28px;position:relative;
  background:linear-gradient(#ffe38a,#e8b62c 30%,#fff4c2 50%,#f5c842 70%,#b8860b);border:1px solid;border-color:#fffadce6 #fffadce6 #78500099 #78500099;box-shadow:-2px 2px 3px #78500059,0 10px 24px #a06e0040}
.sl-reels.sl-win{animation:slotWin .2s steps(2,end) infinite}
.sl-reel{width:calc(var(--icon) * 1.05);height:calc(var(--icon) * 3);background:#fffdf5;border:2px solid #9a6f00;border-radius:16px;position:relative;overflow:hidden}
.sl-reel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(#c992124d,#ffecaa1f 22%,transparent 34% 66%,#ffecaa1f 78%,#c992124d);box-shadow:inset 0 3px 6px #9a6f0038,inset 0 -3px 6px #9a6f0038,inset 0 0 0 1px #fffae1b3}
.sl-strip{position:absolute;top:0;left:0;width:100%;will-change:transform}
.sl-reel.spinning .sl-strip{filter:blur(1.2px)}
.sl-sym{height:var(--icon);display:flex;align-items:center;justify-content:center;font-size:calc(var(--icon) * .62);line-height:1;user-select:none;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.sl-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.sl-gift{position:absolute;transform-origin:50% 50%}
.sl-gift-part{position:absolute;inset:0}
.sl-gift-part svg{width:100%;height:100%;display:block;overflow:visible}
.sl-gift-lid{transform-origin:50% 45%}
.sl-gift-glow{position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,#ffd65abf,#ffd65a00 65%);opacity:0}
.sl-gold{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff8d9,#ffe17a 30%,#ffc629 62%,#e9a600)}
.sl-bit{position:absolute;font-size:30px;line-height:1}
@keyframes slotWin{0%{background:linear-gradient(45deg,#ff9d00,#fffbe0);box-shadow:0 0 80px #ff9d00}to{box-shadow:-2px 2px 3px #78500059}}

/* yay: the title's letters fall in one by one, then "Yay!!!" pops with a burst */
.yay{cursor:pointer;width:100%;outline:none}
.yay-title{font-family:var(--display);font-size:min(10vw,56px);line-height:1.1;color:var(--primary);display:flex;flex-wrap:wrap;justify-content:center;column-gap:.28em}
.yay-w{display:inline-flex;white-space:nowrap}
.yay-w span{display:inline-block;animation:letterFall ease both}
.yay-pop{position:relative;display:inline-block;margin-top:14px}
.yay-word{font-family:var(--display);font-size:min(14vw,72px);color:var(--accent);animation:popIn .55s cubic-bezier(.22,1,.36,1) both;text-shadow:0 2px 0 color-mix(in srgb,var(--text) 20%,transparent)}
.yay-burst{position:absolute;inset:-50px -70px;pointer-events:none}
.yay-burst i,.fin-burst i{position:absolute;left:50%;top:50%;animation:burstFly 1.15s cubic-bezier(.22,1,.36,1) var(--delay) forwards;opacity:0}
.yay-hint,.tap-hint{font-size:13px;font-weight:500;opacity:0;transition:opacity .7s;margin-top:18px}
.yay-hint.on,.tap-hint.on{opacity:.7}
@keyframes letterFall{0%{opacity:0;transform:translateY(-100px)}70%{opacity:1}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.3)}55%{opacity:1;transform:scale(1.12)}to{opacity:1;transform:none}}
@keyframes burstFly{0%{opacity:0;transform:scale(.3)}25%{opacity:1}to{opacity:0;transform:translate(var(--bx),var(--by)) scale(1)}}

/* letter.envelopeArt: a sealed envelope that floats, with the sender's initial on a wax seal */
.env-title{font-size:clamp(26px,7vw,34px)}
.env-art{position:relative;width:min(272px,80vw);margin:22px auto 0;cursor:pointer;animation:envFloat 3.4s ease-in-out infinite;filter:drop-shadow(0 24px 44px rgba(0,0,0,.4))}
.env-art img{width:100%;height:auto;display:block}
.env-seal{position:absolute;left:50%;top:55%;translate:-50% -50%;width:44px;height:44px;border-radius:50%;background:#c4443f;color:#fff1dc;font:700 20px var(--display);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.env-tap{margin:18px 0 0;font-size:14px;font-weight:600;opacity:.8}
.env-tap b{display:block;font-size:26px;font-weight:400;margin-bottom:4px}
.env-art.open{animation:envAway .5s ease forwards}
.lp.typed{opacity:1;transform:none;white-space:pre-wrap}
.lp .caret-bar{animation:caretBlink .85s steps(1) infinite}
.sig-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:18px;opacity:0;transition:opacity .6s,transform .6s;transform:translateY(12px)}
.sig-row.in{opacity:1;transform:none}
.sig-row .lp.sig{margin:0;text-align:right;flex:1;opacity:1;transform:none}
.sig-badge{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--accent)}
@keyframes envFloat{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-12px) rotate(.6deg)}}
@keyframes envAway{to{opacity:0;transform:translateY(-30px) scale(.9)}}

/* ending.layout "party": big HAPPY BIRTHDAY, the name in script, a floating picture, repeating bursts */
.fin-title{font-family:var(--display);font-size:clamp(42px,12vw,64px);line-height:.95;text-transform:uppercase;white-space:pre-line;letter-spacing:-.01em}
.fin-name{font-family:var(--letter);font-size:clamp(36px,10vw,48px);color:var(--accent);margin:4px 0 0}
.fin-pic .gifbox{max-width:200px;animation:envFloat 3.4s ease-in-out infinite}
.fin-foot{font-size:14px;opacity:.6;margin:0}
.fin-bursts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fin-burst{position:absolute}
.fin-burst i{animation-iteration-count:infinite;animation-duration:1.5s;animation-timing-function:ease-out}

/* =============== KARWA CHAUTH LOOK: night sky, typed landing, notes, moonrise, photo finale =============== */
/* theme.backgroundType "nightsky": three drifting star fields, a comet, passing clouds, a skyline.
   Shown in the styles that take their background from the theme (canva/scrapbook/brutal keep their own). */
#bgdeco.type-nightsky{inset:0;overflow:hidden}
[data-style="canva"] #bgdeco.type-nightsky,[data-style="scrapbook"] #bgdeco.type-nightsky,[data-style="brutal"] #bgdeco.type-nightsky{display:none}
.ns-stars,.ns-stars::after{position:absolute;top:0;left:0;border-radius:50%;background:transparent;box-shadow:var(--sh)}
.ns-stars{animation:nsStar linear infinite}
.ns-stars::after{content:"";top:2560px;width:inherit;height:inherit}
.ns-comet{position:absolute;bottom:0;right:0;z-index:1;width:5px;height:85px;border-radius:50% 50% 0 0;background:linear-gradient(#fff,#fff0);animation:nsComet 10s linear infinite}
.ns-cloud{position:absolute;left:100%;animation:nsCloud linear infinite}
.ns-skyline{position:absolute;bottom:0;left:0;width:100%;height:8%;opacity:.6}
@keyframes nsStar{to{transform:translate(-2560px,-2560px)}}
@keyframes nsComet{0%{opacity:1;height:5px;transform:translate(0,0) rotate(-45deg)}to{opacity:1;height:800px;transform:translate(-2560px,-2560px) rotate(-45deg)}}
@keyframes nsCloud{to{transform:translateX(-220vw)}}

/* landing options: typed script line, smaller display greeting */
.greeting.md{font-size:clamp(26px,7.6vw,32px);font-weight:800;line-height:1.2}
#land-line.script{font-family:var(--letter);font-size:24px;line-height:1.35;white-space:pre-line;opacity:1}
.land-typing .caret-bar{animation:caretBlink .85s steps(1) infinite}

/* notes: one picture + title + typed message per page */
.nt{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:384px;margin:0 auto;width:100%}
.nt > *{animation:fadeUp .5s both}
.nt-pic .gifbox{width:128px;max-width:128px}
.nt-pic .gif{border-radius:16px}
.nt-pic .gif-fallback{font-size:56px}
.nt-pic.card .gif{border-radius:16px;box-shadow:0 14px 30px -14px color-mix(in srgb,var(--primary) 60%,transparent)}
.nt-title{font-size:clamp(26px,7.6vw,30px);font-weight:800}
.nt-msg{font-family:var(--letter);font-size:24px;line-height:1.625;font-weight:500;white-space:pre-line;margin:0;min-height:3.2em}
.nt-msg .caret-bar{animation:caretBlink .85s steps(1) infinite}

/* moonrise: balcony rises, the figure slides in, clouds gather then part to reveal the moon */
.mr-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.mr-glow{position:absolute;left:50%;top:9%;translate:-50% 0;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,247,214,.55),rgba(255,247,214,0) 70%);opacity:0;transition:opacity 1.8s ease-out}
.mr-moon{position:absolute;left:50%;top:9%;translate:-50% 0;width:128px;opacity:0;transition:opacity 1.8s ease-out}
div.mr-moon{height:128px;width:72px;margin-top:28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e9e6dc 60%,#cfcabd);width:72px}
.mr-cloud{position:absolute;opacity:0;transform:translateX(-50%);transition:opacity .9s ease-in-out,transform .9s ease-in-out}
.mr-ground{position:absolute;bottom:0;left:50%;translate:-50% 0;width:100%;max-width:calc(100dvh * .66)}
.mr-scene{display:block;width:100%;transform:translateY(100%);transition:transform 1.1s ease-out}
.mr-figure{position:absolute;bottom:0;right:4%;width:68%;transform:translateX(70%);transition:transform .9s ease-out}
.mr-in .mr-scene,.mr-fig .mr-figure{transform:none}
.mr-clouds .mr-cloud{opacity:.95}
.mr-moon-on .mr-glow,.mr-moon-on .mr-moon{opacity:1}
.mr-moon-on .mr-cloud{opacity:0;transform:translateX(calc(-50% + var(--part)));transition-duration:2.4s}
.mr-text{position:fixed;left:0;right:0;top:calc(9% + 9rem);padding:0 24px;display:flex;flex-direction:column;align-items:center;gap:20px;animation:fadeUp .5s both;z-index:2}
.mr-text p{font-family:var(--letter);font-size:30px;font-weight:500;margin:0}
@media (max-height:700px) and (max-width:639px){.mr-figure{width:56%}}
@media (min-width:640px){.mr-moon{width:160px}.mr-glow{width:192px;height:192px}.mr-figure{width:50%}.mr-text{top:calc(9% + 11rem)}}
@media (min-width:768px){.mr-figure{width:42%}}

/* ending.layout "photos": emoji, title, message, tilted photos that drift sideways, swipe dots */
.pe-emoji{font-size:60px;line-height:1}
.pe-title{font-size:clamp(28px,8vw,36px);font-weight:800;line-height:1.2}
.pe-row{display:flex;gap:16px;padding:36px 16px 44px;overflow-x:auto;width:100vw;margin-inline:calc(50% - 50vw);scrollbar-width:none;user-select:none;justify-content:safe center}
.pe-row::-webkit-scrollbar{display:none}
.pe-fig{flex:none;margin:0;background:#fff;padding:8px;border-radius:10px;box-shadow:0 18px 38px -20px color-mix(in srgb,var(--primary) 70%,transparent)}
.pe-fig div{max-height:208px;min-height:120px;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px;min-width:120px}
.pe-fig img{height:auto;max-height:208px;width:auto;max-width:none;display:block}
.pe-dots{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:-28px;font-size:11px;font-weight:600;opacity:.8}
.pe-dots span{display:flex;gap:6px}
.pe-dots i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--text) 22%,transparent)}
.pe-dots i.on{background:var(--text)}
.pe-from{font-size:11px;font-weight:600;opacity:.75;margin:0}
.pe-foot{font-size:14px;opacity:.75;margin:8px 0 0}
.streamers{position:fixed;inset:0;pointer-events:none;z-index:20}

/* =============== DIWALI LOOK: light the diya, sky lanterns, favourite light, collage =============== */
/* diya: an unlit clay diya; a tap lights it, a row of small diyas catches the flame, fireworks, then the reveal */
.dy{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;position:relative}
.dy-title{font-family:var(--display);font-size:clamp(24px,7vw,30px);font-weight:800;line-height:1.2;margin:0}
.dy-hint{font-size:15px;font-weight:600;opacity:.75;margin:0;transition:opacity .4s}
.cd svg,.fl-core svg{width:100%;height:100%;overflow:visible;display:block}
.dy-halo{position:absolute;left:50%;top:22%;width:60px;height:60px;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,102,.75),rgba(255,160,40,.25) 45%,rgba(255,160,40,0) 70%);opacity:0;transform:scale(.4);transition:opacity .8s,transform 1.4s cubic-bezier(.2,.8,.3,1);pointer-events:none}
.dy-flame{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.lit .dy-flame{transform:scale(1);animation:dyFlicker 1.6s ease-in-out .45s infinite}
.lit > .dy-halo{opacity:1;transform:scale(5)}
/* the scene: a big clay diya in front with ten around it (back row small and soft-focus, front
   corners large), like diyas set out on a ledge; bokeh lights hang behind and glow up once lit */
.dy-scene{position:relative;width:min(100%,400px);aspect-ratio:1/.9;margin:6px auto 0}
.dy-wash{position:absolute;left:50%;top:56%;width:100%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(255,170,60,.42),rgba(255,120,40,.12) 45%,rgba(255,120,40,0) 68%);opacity:0;transition:opacity 2s;pointer-events:none}
.dy-bokeh{position:absolute;inset:-6% 2% 40%;pointer-events:none}
.dy-bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.95),rgba(255,176,80,.5) 55%,rgba(255,150,60,0) 72%);filter:blur(var(--bl,3px));opacity:.12;transition:opacity 1.6s ease var(--dl,0s)}
.dy-scene.glow .dy-bokeh i{opacity:var(--op,.8);animation:dyBokeh 4.6s ease-in-out var(--tw,0s) infinite}
.dy-scene.glow .dy-wash{opacity:1}
.cd{position:absolute;translate:-50% 0;z-index:var(--z,1);filter:blur(var(--blur,0px)) brightness(var(--dim,1));transition:filter 1.2s}
.cd img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 12px rgba(0,0,0,.4));-webkit-user-drag:none;user-select:none}
.cd.svg{aspect-ratio:4/3}
.cd-flame{position:absolute;left:50.6%;bottom:78%;width:19%;aspect-ratio:1/2.15;translate:-50% 0;transform-origin:50% 100%;transform:scale(0);border-radius:50% 50% 46% 46%/64% 64% 36% 36%;background:radial-gradient(ellipse 50% 60% at 50% 74%,#fff 0 22%,#fff4c0 36%,#ffd04a 54%,#ff9020 72%,rgba(255,90,20,0) 82%);filter:drop-shadow(0 0 6px rgba(255,200,90,.95)) drop-shadow(0 0 16px rgba(255,160,50,.7));transition:transform .5s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
.cd-glow{position:absolute;left:50.6%;bottom:94%;width:175%;aspect-ratio:1;translate:-50% 50%;border-radius:50%;background:radial-gradient(circle,rgba(255,226,130,.85),rgba(255,170,60,.32) 34%,rgba(255,140,40,0) 66%);opacity:0;transform:scale(.4);transition:opacity .9s,transform 1.4s cubic-bezier(.2,.8,.3,1);pointer-events:none}
.cd.lit .cd-flame{transform:scale(1);animation:cdFlicker 1.5s ease-in-out .5s infinite}
.cd.lit .cd-glow{opacity:1;transform:scale(1)}
.cd.main{border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cd.main:not(.lit){animation:dyNudge 2.2s ease-in-out infinite}
.cd.main:not(.lit)::after{content:"";position:absolute;left:50.6%;top:-4%;width:26%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 80%,transparent);animation:cdTap 1.8s ease-out infinite;pointer-events:none}
.dy .dy-hint{margin-top:-4px}
@keyframes cdFlicker{0%,100%{transform:scale(1,1) rotate(0)}20%{transform:scale(.94,1.08) rotate(-2.5deg)}45%{transform:scale(1.05,.95) rotate(2deg)}70%{transform:scale(.97,1.04) rotate(-1deg)}}
@keyframes cdTap{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
@keyframes dyBokeh{0%,100%{scale:1}50%{scale:1.12;opacity:calc(var(--op,.8) * .7)}}
.dy-sky{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.dy-fw{position:absolute;width:0;height:0}
.dy-fw i{position:absolute;left:0;top:0;animation:burstFly 1.4s cubic-bezier(.22,1,.36,1) var(--delay) forwards;opacity:0}
.dy-reveal{display:flex;flex-direction:column;align-items:center;gap:10px;animation:popIn .7s cubic-bezier(.22,1,.36,1) both}
.dy-big{font-family:var(--display);font-size:clamp(34px,10vw,50px);line-height:1.08;font-weight:800;margin:0;white-space:pre-line;color:var(--accent);text-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.dy-msg{font-family:var(--letter);font-size:24px;line-height:1.35;margin:0;white-space:pre-line}
@keyframes dyFlicker{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.06,.94) rotate(-3deg)}50%{transform:scale(.95,1.07) rotate(2deg)}75%{transform:scale(1.03,.97) rotate(-1deg)}}
@keyframes dyNudge{0%,100%{transform:none}50%{transform:translateY(-6px)}}

/* lanterns: sky lanterns rise into place; each opens a memory (photo + caption), then floats away */
.ln-sky{position:relative;width:100%;max-width:420px;height:min(64vh,520px);margin:0 auto;transition:height .9s cubic-bezier(.4,0,.2,1)}
.ln-sky.done{height:0;overflow:hidden}
#s-lanterns .step-sub{margin-top:2px;font-weight:600;opacity:.9}
.ln{position:absolute;width:88px;height:116px;border:0;background:none;padding:0;cursor:pointer;translate:-50% 0;animation:lnRise 2.6s cubic-bezier(.2,.7,.3,1) var(--d,0s) both;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ln > span{display:block;width:100%;height:100%;animation:lnBob 3.4s ease-in-out var(--b,0s) infinite;filter:drop-shadow(0 0 14px rgba(255,170,60,.65))}
.ln svg{width:100%;height:100%;overflow:visible;display:block}
.ln small{position:absolute;left:50%;bottom:-20px;translate:-50% 0;font-size:11px;font-weight:700;opacity:.75;white-space:nowrap}
.ln.seen{animation:lnAway 2.4s ease-in forwards;pointer-events:none}
/* the tap nudge: a soft ring ripples out from each lantern still waiting to be opened */
.ln:not(.seen)::after{content:"";position:absolute;left:50%;top:46%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 75%,transparent);animation:tapRipple 2s ease-out calc(var(--d,0s) + 2.6s) infinite;opacity:0;pointer-events:none}
@keyframes tapRipple{0%{opacity:.85;transform:scale(.55)}100%{opacity:0;transform:scale(1.55)}}
.ln-note{position:absolute;translate:-50% 0;width:max-content;max-width:180px;margin:0;font-family:var(--letter);font-size:21px;line-height:1.2;text-align:center;color:var(--accent);text-shadow:0 0 14px color-mix(in srgb,var(--accent) 45%,transparent);animation:lnNote 3s ease-out forwards;pointer-events:none}
@keyframes lnNote{0%{opacity:0;transform:translateY(30px) scale(.85)}15%{opacity:1;transform:translateY(20px) scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.ln-pop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:rgba(10,6,20,.62);backdrop-filter:blur(3px);animation:fadeUp .35s both}
.ln-pop .pol{width:min(300px,82vw);animation:popIn .5s cubic-bezier(.22,1,.36,1) both}
.ln-pop .pol figcaption{white-space:pre-line}
.ln-pop .btn{margin-top:18px}
.ln-done{font-family:var(--letter);font-size:22px;margin:4px 0 0;animation:fadeUp .6s both}
@keyframes lnRise{from{opacity:0;transform:translateY(70vh) scale(.6)}to{opacity:1;transform:none}}
@keyframes lnBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes lnAway{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-80vh) scale(.5)}}

/* favlight: scattered lights drift together into one diya, then the lines appear */
.fl{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;min-height:60vh;justify-content:center}
.fl-layer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.fl-dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle,#fff8d6 0,#ffd25e 35%,rgba(255,170,40,0) 70%);animation:flTwinkle 1.8s ease-in-out var(--t,0s) infinite;transition:transform 1.5s cubic-bezier(.6,0,.3,1),opacity 1.5s ease-in}
.fl-core,.fl-core.cd{position:relative;left:auto;top:auto;translate:none;width:190px;height:auto;opacity:0;transform:scale(.5);transition:opacity .8s,transform 1s cubic-bezier(.2,1.4,.4,1);margin-bottom:10px}
.fl-core.on{opacity:1;transform:none}
.fl-line{font-family:var(--letter);font-size:clamp(26px,7.4vw,32px);line-height:1.25;margin:0;animation:fadeUp .8s both}
.fl-line.last{font-family:var(--display);font-weight:800;font-size:clamp(30px,8.6vw,40px);color:var(--accent);text-shadow:0 0 22px color-mix(in srgb,var(--accent) 45%,transparent)}
.fl-tail{font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin:8px 0 6px;animation:fadeUp .8s both}
@keyframes flTwinkle{0%,100%{opacity:.35;scale:.7}50%{opacity:1;scale:1.15}}

/* gallery layout "collage": photos pinned in a grid, wide and square tiles, popping in one by one */
.cl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:400px;margin:6px auto 0}
.cl-fig{margin:0;background:#fff;padding:6px 6px 8px;border-radius:6px;rotate:var(--r,0deg);box-shadow:0 14px 30px -16px rgba(0,0,0,.55);animation:clPop .6s cubic-bezier(.22,1,.36,1) var(--d,0s) both;position:relative}
.cl-fig.wide{grid-column:span 2}
.cl-img{aspect-ratio:1;overflow:hidden;border-radius:3px;display:grid;place-items:center;font-size:40px;background:color-mix(in srgb,var(--accent) 22%,#fff)}
.cl-fig.wide .cl-img{aspect-ratio:16/10}
.cl-img img{width:100%;height:100%;object-fit:cover;display:block}
.cl-fig figcaption{font-family:var(--letter);font-size:18px;line-height:1.2;color:#5a4636;text-align:center;margin-top:5px}
@keyframes clPop{0%{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:none}}

/* Diwali steps in each style */
[data-style="game"] .dy-title,[data-style="game"] .fl-tail{font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.7}
[data-style="game"] .dy-big,[data-style="game"] .fl-line.last{font-family:'Press Start 2P',monospace;font-size:clamp(18px,5.4vw,24px);line-height:1.5}
[data-style="game"] .ln svg,[data-style="game"] .fl-core svg{shape-rendering:crispEdges}
[data-style="game"] .cl-fig{border-radius:0;box-shadow:6px 6px 0 #000}
[data-style="game"] .cl-img{border-radius:0}
[data-style="stopmotion"] .cd.main:not(.lit),[data-style="stopmotion"] .fl-core.on,[data-style="stopmotion"] .cl-fig{animation-name:boil;animation-duration:.6s;animation-timing-function:steps(1);animation-iteration-count:infinite}
[data-style="stopmotion"] .ln > span,[data-style="stopmotion"] .lit .dy-flame,[data-style="stopmotion"] .cd.lit .cd-flame{animation-timing-function:steps(4)}
[data-style="stopmotion"] .cl-fig{clip-path:polygon(0 1%,30% 0,60% 1%,100% 0,99% 40%,100% 100%,55% 99%,0 100%,1% 50%);box-shadow:none;filter:drop-shadow(5px 7px 0 rgba(0,0,0,.2))}
[data-style="insta"] .dy-big,[data-style="insta"] .fl-line.last{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;color:#fff;text-shadow:2px 0 #ff2d78,-2px 0 #2de2ff}
[data-style="insta"] .cl-fig{border-radius:12px}
[data-style="canva"] .dy-big,[data-style="canva"] .fl-line.last{font-weight:400;font-style:italic;text-shadow:none;color:var(--primary)}
[data-style="canva"] .fl-tail{font-family:'Montserrat',sans-serif;letter-spacing:.3em;font-size:12px}
[data-style="canva"] .cl-fig{border-radius:2px;box-shadow:0 20px 50px rgba(0,0,0,.08);outline:1px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:-4px}
[data-style="canva"] .ln-sky .ln small{letter-spacing:.2em;text-transform:uppercase;font-size:9px}
[data-style="scrapbook"] .dy-big,[data-style="scrapbook"] .fl-line.last{font-weight:400;rotate:-2deg;text-shadow:none;color:#3b2f2a;background:var(--accent);padding:2px 14px}
[data-style="scrapbook"] .cl-fig{border-radius:0}
[data-style="scrapbook"] .cl-fig::before{content:"";position:absolute;top:-9px;left:50%;width:62px;height:18px;translate:-50% 0;rotate:4deg;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--primary) 80%,transparent) 0 5px,color-mix(in srgb,var(--primary) 55%,transparent) 5px 10px);opacity:.9;z-index:1}
[data-style="scrapbook"] .cl-fig:nth-child(even)::before{rotate:-5deg}
[data-style="brutal"] .dy-big,[data-style="brutal"] .fl-line.last{color:#111;text-shadow:none;background:#fff;border:3px solid #111;box-shadow:6px 6px 0 #111;padding:4px 16px;rotate:-2deg}
[data-style="brutal"] .cd img,[data-style="brutal"] .fl-core svg,[data-style="brutal"] .ln svg{filter:drop-shadow(5px 5px 0 #111)}
[data-style="brutal"] .cl-fig{border:3px solid #111;border-radius:10px;box-shadow:6px 6px 0 #111}
[data-style="doodle"] .cl-fig{border:2.5px solid var(--text);box-shadow:var(--shadow)}
[data-style="doodle"] .dy-big,[data-style="doodle"] .fl-line.last{text-shadow:3px 3px 0 color-mix(in srgb,var(--primary) 35%,transparent)}
@media (prefers-reduced-motion: reduce){.th-stage::after,.ln::after,.ck-item::before,.ln,.ln > span,.cl-fig,.fl-dot,.cd,.cd-flame,.dy-bokeh i,.halo,.ck-item,.ck-item img,#frame .fr-tl,#frame .fr-tr{animation:none!important}}

/* =============== FESTIVE SKY + MANDAP FRAME + CRACKERS =============== */
/* theme.backgroundType "fireworks": the fireworks engine (assets/art/fx-fireworks.js) on two canvases */
#bgdeco.type-fireworks{inset:0;overflow:hidden}
#bgdeco.type-fireworks canvas,#bgdeco .fw-sky{position:absolute;left:0;top:0}
#bgdeco .fw-sky{inset:0}
#bgdeco.type-fireworks{display:block!important;transition:opacity 1.2s}
body.fw-off #bgdeco.type-fireworks{opacity:0}
#frame .fr-petals{transition:opacity 1s}
body.petals-day[data-scene="night"] #frame .fr-petals{opacity:0}
/* theme.frame "mandap" (the blessing-card layout): marigold garlands with bells in the top corners,
   a rangoli floor with kalash and diyas along the bottom, petals falling; the content sits between */
#frame{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#frame img{position:absolute;display:block;-webkit-user-drag:none}
#frame .fr-tl{left:0;top:0;width:min(42%,300px);transform-origin:12% 0;animation:frSway 7s ease-in-out infinite;z-index:2}
#frame .fr-tr{right:0;top:0;width:min(42%,300px);transform-origin:88% 0;animation:frSway 7s ease-in-out -3.5s infinite;z-index:2}
#frame .fr-floor{left:0;right:0;bottom:0;width:100%;z-index:1}
#frame .fr-bl{left:0;bottom:0;width:min(34%,190px);z-index:2}
#frame .fr-br{right:0;bottom:0;width:min(34%,190px);z-index:2}
#frame .fr-petals{position:absolute;inset:0;z-index:3}
#frame .fr-petals img{top:-24px;animation:frPetal linear infinite}
@keyframes frSway{0%,100%{rotate:0deg}50%{rotate:1.6deg}}
@keyframes frPetal{0%{transform:translateY(0) rotate(0);opacity:0}8%{opacity:.95}100%{transform:translateY(108vh) translateX(40px) rotate(var(--rot,240deg));opacity:.8}}
/* frameSet "diwali": hanging lanterns that glow, a rangoli and marigolds below */
#frame .fy{position:absolute;top:0;width:min(62%,320px);height:auto;overflow:visible;z-index:2}
#frame .fy-l{left:0}
#frame .fy-r{right:0;transform:scaleX(-1)}
#frame .fy-wire{fill:none;stroke:#7a5230;stroke-width:1.2;opacity:.8}
#frame .fy-b{animation:fyTw 2.6s ease-in-out infinite}
@keyframes fyTw{0%,100%{opacity:1}50%{opacity:.45}}
#frame .fr-rangoli{left:50%;right:auto;width:min(44%,230px);translate:-50% 0;bottom:-2px}
#frame .fr-mari{width:min(28%,150px);bottom:-6px}
#frame .fr-mari.fr-br{transform:scaleX(-1)}
body[data-frame="mandap"] .scene{padding-top:calc(64px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body[data-frame="mandap"][data-mode="dark"] #frame .fr-floor{filter:brightness(.8)}
/* frameSet "dhanteras": the garlands hang lower than the diwali lights, so the content starts below them */
body[data-frame="mandap"][data-frame-set="dhanteras"] .scene{padding-top:calc(min(29.4vw,210px) * 1.1 + env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body[data-frame-set="dhanteras"] #frame .fr-tl,body[data-frame-set="dhanteras"] #frame .fr-tr{width:min(29.4%,210px)}
/* headings stay in the gap between the two garlands */
body[data-frame="mandap"] :is(.step-title,.th-title,.dy-title,.ck-title,.nt-title){max-width:min(72%,330px);margin-inline:auto;text-wrap:balance}
/* the mandala that turns slowly behind a message's picture (and the finale's) */
.has-halo{position:relative;display:grid;place-items:center;isolation:isolate}
.halo{position:absolute;left:50%;top:50%;width:128%;max-width:none;translate:-50% -50%;z-index:-1;animation:haloSpin 48s linear infinite;pointer-events:none;opacity:.95}
#end-gif.has-halo .halo{width:150%}
.halo.tint{opacity:1;aspect-ratio:2512/2465;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
@keyframes haloSpin{to{rotate:360deg}}
[data-style="game"] .halo{animation-timing-function:steps(24)}
[data-style="stopmotion"] .halo{animation-timing-function:steps(36)}
[data-style="brutal"] .halo,[data-style="doodle"] .halo{opacity:.55}
[data-style="canva"] .halo{opacity:.7}

/* crackers: anar, rocket, chakri, bomb and phuljhari appear one by one, the fuse fizzes and each
   goes off in its own way; then a last volley and the finale opens on its own */
.ckr{position:relative;margin:44px auto 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.ck-title{font-family:var(--display);font-size:clamp(22px,6.4vw,28px);font-weight:800;margin:0}
.ck-field{position:relative;width:100%;max-width:420px;height:min(62vh,500px)}
.ck-item{position:absolute;translate:-50% -100%;width:var(--w,90px);animation:ckIn .55s cubic-bezier(.3,1.6,.5,1) both;z-index:2}
.ck-item img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45));-webkit-user-drag:none}
.ck-item.shake img{animation:ckShake .09s linear infinite}
.ck-item.spin img{animation:ckSpin .32s linear infinite}
.ck-item.fly{animation:none;transition:transform 1.05s cubic-bezier(.45,0,.85,.45);transform:translateY(calc(-1 * var(--fly,60vh)))}
.ck-item.gone{animation:ckGone .4s ease-out forwards}
.ck-item.tap{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ck-item.tap:not(.lit)::after{content:"";position:absolute;left:50%;bottom:-6px;width:80%;height:16px;translate:-50% 0;border-radius:50%;background:radial-gradient(ellipse,rgba(255,200,90,.55),rgba(255,170,60,0) 70%);animation:ckReady 1.4s ease-in-out infinite;z-index:-1}
.ck-item.tap:not(.lit) img{animation:ckWiggle 2.4s ease-in-out infinite}
.ck-item.tap:not(.lit)::before{content:"";position:absolute;left:50%;top:55%;width:110%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 75%,transparent);animation:tapRipple 2s ease-out var(--rd,0s) infinite;opacity:0;pointer-events:none}
.ckr-hint{font-size:15px;font-weight:600;opacity:.85;margin:0}
@keyframes ckReady{0%,100%{opacity:.5;scale:.9}50%{opacity:1;scale:1.1}}
@keyframes ckWiggle{0%,86%,100%{transform:none}90%{transform:rotate(-5deg)}95%{transform:rotate(5deg)}}
.ck-sp{position:absolute;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#fff3c4;box-shadow:0 0 6px 2px #ffb92e;pointer-events:none;animation:ckSpark var(--t,.6s) ease-out forwards;z-index:3}
.ck-flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),rgba(255,246,214,.85),rgba(255,190,90,.25) 30%,rgba(255,160,60,0) 62%);animation:ckFlash .55s ease-out forwards}
.ck-boom{position:absolute;width:0;height:0;z-index:3}
.ck-boom i{position:absolute;left:0;top:0;animation:burstFly 1.2s cubic-bezier(.22,1,.36,1) var(--delay) forwards;opacity:0}
body.ck-quake .scene.active{animation:ckQuake .4s linear}
@keyframes ckIn{0%{opacity:0;transform:scale(.2) translateY(30px)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes ckShake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,1px) rotate(-3deg)}75%{transform:translate(2px,-1px) rotate(3deg)}}
@keyframes ckSpin{to{rotate:360deg}}
@keyframes ckGone{0%{opacity:1;transform:scale(1);filter:brightness(1)}30%{filter:brightness(3)}100%{opacity:0;transform:scale(1.6);filter:brightness(4)}}
@keyframes ckSpark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
@keyframes ckFlash{0%{opacity:1}100%{opacity:0}}
@keyframes ckQuake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
[data-style="game"] .ck-title{font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.7}
[data-style="game"] .ck-sp{border-radius:0;box-shadow:none;background:#ffd23f}
[data-style="brutal"] .ck-item img{filter:drop-shadow(5px 5px 0 #111)}
[data-style="stopmotion"] .ck-item:not(.fly){animation-timing-function:steps(3)}

/* thali: the Bhai Dooj thali fills up piece by piece (a tap adds the next one), then the tilak at
   the top: roli flies up, a red tilak is drawn and grains of chawal fly over from the bowl and stick */
.th{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.th-title{font-family:var(--display);font-size:clamp(24px,7vw,30px);font-weight:800;margin:0}
.th-tilak{position:relative;width:140px;height:140px;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:opacity .6s,transform .8s cubic-bezier(.3,1.5,.5,1)}
.th-tilak.on{opacity:1;transform:none}
.th-tilak .halo{width:170%}
.th-tilak::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.55),rgba(255,180,80,0) 66%);opacity:0;transition:opacity 1s;z-index:-1}
.th-tilak.glow::before{opacity:1}
.th-tilak svg{width:54px;height:124px;overflow:visible}
.th-mark{fill:none;stroke:#c8101e;stroke-width:17;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90;transition:stroke-dashoffset 1s cubic-bezier(.6,0,.3,1);filter:drop-shadow(0 0 4px rgba(200,16,30,.5))}
.th-tilak.draw .th-mark{stroke-dashoffset:0}
.th-stage{position:relative;width:min(100%,400px);aspect-ratio:1448/1086;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.th-stage.done{cursor:default}
.th-stage:not(.done)::after{content:"";position:absolute;left:50%;top:62%;width:78%;aspect-ratio:2.6/1;translate:-50% -50%;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 75%,transparent);animation:tapRipple 2s ease-out 1s infinite;opacity:0;pointer-events:none;z-index:9}
.th-piece{position:absolute;opacity:0;pointer-events:none}
.th-piece.in{animation:thIn .65s cubic-bezier(.3,1.5,.5,1) forwards}
.th-piece.th-plate.in{animation:thPlate .8s cubic-bezier(.2,1,.3,1) forwards}
.th-piece img{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.22));-webkit-user-drag:none}
.th-piece .gif-fallback{font-size:40px;text-align:center}
.th-flame{position:absolute;left:50%;top:12%;width:110%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(255,226,130,.9),rgba(255,170,60,.3) 40%,rgba(255,150,50,0) 68%);animation:thGlow 1.8s ease-in-out infinite;pointer-events:none}
.th-name{position:absolute;left:50%;top:-6px;translate:-50% -100%;font-family:var(--letter);font-size:22px;font-weight:700;white-space:nowrap;color:var(--accent);text-shadow:0 1px 0 color-mix(in srgb,var(--bg1) 70%,transparent);animation:thName 1.4s ease-out forwards;pointer-events:none}
.th-hint{font-size:15px;font-weight:600;opacity:.8;margin:0;min-height:1.4em}
.th-count{display:flex;gap:6px;justify-content:center}
.th-count i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.2;transition:opacity .3s}
.th-count i.on{opacity:.85}
.th-fly{position:fixed;left:0;top:0;z-index:6;pointer-events:none}
.th-fly.grain{width:7px;height:3.6px;border-radius:50%;background:#fffaf0;box-shadow:0 0 0 .5px rgba(120,90,40,.35)}
.th-fly.roli{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#ff4a4a,#c8101e 60%,rgba(200,16,30,0) 72%)}
